<!doctype html>
<html lang="nl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin login - SuperCar Vault</title>
    <link rel="stylesheet" href="admin.css" />
</head>

<body>

    <div class="login-wrapper">
        <div class="paneel login-paneel">
            <h1>Admin login</h1>

            <form action="dashboard.html">
                <label for="gebruiker">Gebruikersnaam</label>
                <input id="gebruiker" type="text" placeholder="admin" required>

                <label for="wachtwoord">Wachtwoord</label>
                <input id="wachtwoord" type="password" placeholder="********" required>

                <div class="rij-knoppen" style="margin-top:16px">
                    <button class="btn btn-accent" type="submit">Inloggen</button>
                    <a class="btn" href="../index.html">Terug naar site</a>
                </div>
            </form>
        </div>
    </div>

</body>

</html>
